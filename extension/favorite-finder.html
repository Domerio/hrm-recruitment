<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>收藏牛人定位 · HRM</title>
  <link rel="stylesheet" href="favorite-finder.css">
</head>
<body>
  <main>
    <header><span class="mark">H</span><div><h1>收藏牛人定位</h1><p>从工作台档案找到 BOSS 收藏中的对应牛人</p></div></header>
    <section>
      <label for="candidate-id">工作台候选人编号</label>
      <div class="input-row"><input id="candidate-id" inputmode="numeric" placeholder="例如 140" autocomplete="off"><button id="load" disabled>读取档案</button></div>
      <p id="target" class="target">正在连接工作台…</p>
      <p class="help">优先匹配平台标识，缺少标识时核对职业经历。核验简历后返回收藏列表，滚动并高亮对应卡片；不会发送消息、打招呼或更改收藏。</p>
      <div class="actions"><button id="start" class="primary" disabled>开始定位</button><button id="stop" disabled>停止</button><button id="show-tab" hidden>查看 BOSS 标签页 ↗</button></div>
      <p id="status" role="status" aria-live="polite"></p>
      <details id="diagnostics-box" hidden><summary>定位诊断</summary><pre id="diagnostics"></pre></details>
      <p class="help">请使用收藏这些牛人的招聘账号登录 BOSS。找不到时请检查账号及收藏筛选条件。一次最多核对 100 批列表，超过 3 分钟自动结束。</p>
    </section>
    <a id="workbench" target="_blank" rel="noopener noreferrer">打开工作台 ↗</a>
  </main>
  <script type="module" src="favorite-finder.js"></script>
</body>
</html>
